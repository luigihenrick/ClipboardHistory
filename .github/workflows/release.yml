name: Release

run-name: Release ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v1.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libxkbcommon-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Type-check and build frontend
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  create-release:
    name: Create draft release
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          if [[ -z "$tag" ]]; then
            echo "::error::No release tag. Pass a tag such as v1.3.0."
            exit 1
          fi

          if [[ "$tag" != v* ]]; then
            echo "::error::Release tags must start with 'v' (got '$tag')."
            exit 1
          fi

          version=$(jq -r .version package.json)
          if [[ "${tag#v}" != "$version" ]]; then
            echo "::error::Tag $tag does not match package.json version $version."
            echo "::error::Run 'npm run version:bump' and commit it before pushing the tag."
            exit 1
          fi

          tag_sha=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}" || true)
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag points to $tag_sha, but this workflow runs at $GITHUB_SHA."
            echo "::error::Push the tag from this commit or delete/recreate it."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## ClipHistory ${RELEASE_TAG#v}"
            echo
            cat .github/release-notes.md
          } > "$RUNNER_TEMP/cliphistory-release-notes.md"

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"

          # `gh release list --json` has no databaseId field in older gh versions,
          # and drafts are not reliably returned by the by-tag endpoint. Query the
          # REST API instead; it returns drafts and the numeric id.
          release_id_for_tag() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -r --arg tag "$1" 'first(.[] | select(.tag_name == $tag) | .id)'
          }

          release_id=$(release_id_for_tag "$tag")

          if [[ -n "$release_id" ]]; then
            echo "Reusing release $release_id for $tag."
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/cliphistory-release-notes.md"
          else
            echo "Creating draft release for $tag..."
            body=$(cat "$RUNNER_TEMP/cliphistory-release-notes.md")

            # Create through the API so the numeric id comes back in the response.
            # target_commitish is ignored when the tag already exists.
            if response=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f name="ClipHistory $tag" \
              -f target_commitish="$GITHUB_SHA" \
              -F draft=true \
              -F prerelease=false \
              -f body="$body"); then
              release_id=$(jq -r .id <<< "$response")
            else
              # The release may already exist even if the list above lagged.
              for _ in {1..10}; do
                sleep 3
                release_id=$(release_id_for_tag "$tag")
                [[ -n "$release_id" ]] && break
              done
            fi
          fi

          if [[ -z "$release_id" || "$release_id" == "null" ]]; then
            echo "::error::Could not find or create a release for $tag."
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported Ubuntu to keep the AppImage/.deb glibc
          # requirements compatible with more distributions.
          - name: Linux x64
            platform: ubuntu-22.04
            cache_key: linux-x64
            rust_targets: ""
            args: ""
          - name: Windows x64
            platform: windows-latest
            cache_key: windows-x64
            rust_targets: ""
            args: ""
          # Avoid the macOS arm64 hosted-runner capacity pool. The Intel runner
          # cross-compiles both architectures into the universal DMG.
          - name: macOS universal
            platform: macos-15-intel
            cache_key: macos-universal
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.cache_key }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            rpm \
            build-essential \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci

      # Optional signing: add the usual Tauri secrets (APPLE_CERTIFICATE,
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
      # APPLE_TEAM_ID) and pass them as env vars here. Without them the macOS bundle keeps
      # the ad-hoc identity from tauri.conf.json; users may need to allow it on first launch.
      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: Smoke test AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool dbus-x11
          app=$(find src-tauri/target/release/bundle -type f -name '*.AppImage' | head -n1)
          if [[ -z "$app" ]]; then
            echo "::error::No AppImage found under src-tauri/target/release/bundle"
            find src-tauri/target/release/bundle -maxdepth 3 -type f || true
            exit 1
          fi
          chmod +x "$app"

          xvfb-run -a bash -c '
            set -euo pipefail
            app="$1"
            WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 \
              dbus-run-session -- "$app" --appimage-extract-and-run --toggle > /tmp/cliphistory-smoke.log 2>&1 &
            app_pid=$!
            for _ in $(seq 1 30); do
              if xdotool search --name ClipHistory >/dev/null 2>&1; then
                echo "AppImage window appeared"
                kill "$app_pid" || true
                wait "$app_pid" || true
                exit 0
              fi
              sleep 0.5
            done
            cat /tmp/cliphistory-smoke.log
            kill "$app_pid" || true
            wait "$app_pid" || true
            exit 1
          ' _ "$app"

  verify-release:
    name: Verify release assets
    needs: [create-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - name: Check required bundles
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[].name')

          require_asset() {
            if ! grep -qiE "$1" <<< "$assets"; then
              echo "::error::Missing release asset matching: $1"
              echo "$assets"
              exit 1
            fi
          }

          require_asset '\.AppImage$'
          require_asset '\.deb$'
          require_asset '\.rpm$'
          require_asset '\.msi$'
          require_asset 'setup\.exe$'
          require_asset '\.dmg$'

  publish-release:
    name: Publish release
    needs: [create-release, build, verify-release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

          url=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${RELEASE_TAG//\//%2F}" | jq -r .html_url)
          {
            echo "### Release published"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
